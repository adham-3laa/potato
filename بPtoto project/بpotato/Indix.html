<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potato Restaurant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><div class="container header-content">
        <div class="logo"><i class="fas fa-utensils"></i><div>
            <h1><span>Potato</span> Restaurant</h1>
            <p class="tagline">Delicious food made with passion</p>
        </div></div>
        <div class="cart-icon" id="cartIcon">
            <i class="fas fa-shopping-cart"></i><span class="cart-count">0</span>
        </div>
    </div></header>

    <main class="container">
        <h2 class="page-title">Our Menu</h2>
        
        <div class="menu-controls">
            <input type="text" id="searchInput" class="search-input" placeholder="Search...">
            <select class="filter-select" id="brandFilter"><option value="">All Brands</option></select>
            <select class="filter-select" id="typeFilter"><option value="">All Types</option></select>
        </div>

        <div class="loading-spinner" id="loadingSpinner">
            <div class="spinner"></div><p>Loading...</p>
        </div>

        <div class="products-grid" id="productsGrid"></div>
        
        <div class="empty-state" id="emptyState" style="display:none">
            <i class="fas fa-utensils"></i><h3>No items found</h3><p>Try different filters</p>
        </div>

        <div id="paginationControls" class="pagination-controls"></div>
    </main>

    <div class="modal" id="productModal">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <div class="product-detail" id="productDetail"></div>
        </div>
    </div>

    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3>Your Order</h3><span class="close-cart" id="closeCart">&times;</span>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <div class="cart-total"><span>Total:</span><span id="cartTotal">$0.00</span></div>
            <button class="checkout-btn" id="checkoutBtn">Checkout</button>
        </div>
    </div>

    <footer><div class="container footer-content">
        <div class="footer-logo"><span>Potato</span> Restaurant</div>
        <p>© 2023 All rights reserved.</p>
    </div></footer>

    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
